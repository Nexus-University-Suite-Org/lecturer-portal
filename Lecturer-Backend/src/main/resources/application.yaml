server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: lecturer-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus_lecturer}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:Alvin11David.}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE

lecturer:
  jwt:
    secret: ${JWT_SECRET:lecturer-portal-secret-key-change-in-production-2026-ultra-secure-long-enough}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5176,http://127.0.0.1:5176,http://localhost:5175,http://localhost:5174,http://localhost:5173}

nad:
  base-url: ${NAD_BACKEND_URL:http://localhost:8083}
  admin-email: ${NAD_ADMIN_EMAIL:admin@nexus.edu}
  admin-password: ${NAD_ADMIN_PASSWORD:admin123}

logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.web.multipart: DEBUG

set-password:
  # Must match REG-Backend's JWT_SECRET (registrar-hub/.env) so registrar-issued
  # set-password tokens verify correctly here.
  secret: ${SET_PASSWORD_SECRET:reg-backend-dev-secret-key-change-in-production}
